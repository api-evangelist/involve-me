notes:
  - >-
    404s here are real 404s, not SPA catch-alls — involve.me's Caddy/Laravel edge
    returns an HTML "Page Not Found" body with a 404 status, so there is no
    soft-200 false-credit risk on this host.
  - >-
    No A2A agent card exists on any host. Per pipeline policy nothing was written
    to a2a/ — an agent card is the one artifact that may never be authored on a
    provider's behalf.
