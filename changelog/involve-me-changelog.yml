nearest_equivalent:
  url: https://www.involve.me/blog?category=product
  type: blog category
  cadence: irregular
  entries: []
  entries_note: >-
    Deliberately empty. The product-category posts are marketing announcements
    (for example https://www.involve.me/blog/product-updates-in-june-23 and
    https://www.involve.me/blog/soc2-compliance) with no version number, no date-
    ordered completeness, and no breaking-versus-additive classification. Copying
    them into a structured entries[] would misrepresent announcement copy as a
    change record, so nothing was transcribed.

api_change_history:
  applicable: false
  note: >-
    There is no public API contract to change, so there is nothing an integrator
    would need a changelog to track. The one change that DID break integrators —
    the retirement of developers.involve.me and docs.involve.me, which third-party
    integration guides still cite — was never announced anywhere. See
    lifecycle/involve-me-lifecycle.yml#deprecation.

recommendation_to_provider: >-
  Publish a dated changelog separate from the marketing blog, and classify each
  entry as breaking or additive — starting with the webhook payload, whose
  event.version field implies a versioning contract that no policy backs.
