apis:
- name: involve.me Website Content MCP Server
  description: >-
    A live, OAuth-protected Model Context Protocol server that involve.me serves from
    its own infrastructure and advertises through RFC 9728 protected-resource metadata
    on www.involve.me. SCOPE: it exposes the Statamic CMS behind the involve.me
    MARKETING WEBSITE — entries, collections, taxonomy terms, assets, globals and
    blueprints — not the involve.me funnel product. There is no MCP, REST or GraphQL
    interface to funnels, submissions, participants, contacts or email sequences. The
    tool list is auth-gated (JSON-RPC tools/list returns 401 with a spec-correct
    WWW-Authenticate Bearer challenge), so no tool schemas have been recorded.
  humanURL: https://www.involve.me/
  baseURL: https://www-cdn.involve.me/mcp/statamic
  tags:
  - Model Context Protocol
  - Content Management
  - OAuth
  properties:
  - type: MCPServer
    url: mcp/involve-me-mcp.yml
  - type: Authentication
    url: authentication/involve-me-authentication.yml
  - type: OAuthScopes
    url: scopes/involve-me-scopes.yml
