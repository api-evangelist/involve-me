aid: involve-me
name: involve.me
description: >-
  involve.me is an AI quiz, form and funnel builder with built-in email automation
  and a lightweight CRM, operated by stereosense GmbH and used by marketing teams to
  capture, qualify and follow up on leads. Customers build quizzes, assessments,
  calculators, product finders, landing pages, surveys and payment pages in a no-code
  editor, publish them as a hosted page or an embedded widget, and route submissions
  into 55+ native CRM and email destinations. Its programmable surface is deliberately
  narrow: there is no public REST API and no OpenAPI, and the only machine-addressable
  paths are an outbound webhook that fires when a participant completes a funnel
  (Scale plan and above), a copy-paste JavaScript embed loader, Zapier and Make
  connectors, and an OAuth-protected Model Context Protocol server that exposes the
  marketing website's Statamic CMS rather than the product itself.
