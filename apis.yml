x-pointers-deliberately-omitted:
  note: >-
    These artifacts exist in the repo and record an honest ABSENCE. No common[]
    pointer is emitted for them, because the pointer asserts the provider publishes
    that surface — the same rule this pipeline applies to a well-known probe where
    every path 404s. Emitting them would credit involve.me for documents it does not
    serve.
  omitted:
  - type: ChangeLog
    artifact: changelog/involve-me-changelog.yml
    reason: >-
      No changelog exists. /changelog, /release-notes, /product-updates, /whats-new
      and /updates all return 404; the nearest equivalent is a marketing blog category.
  - type: RateLimits
    artifact: rate-limits/involve-me-rate-limits.yml
    reason: limit_count is 0 — no rate limits are published, because no API is published.
  - type: Packages
    artifact: packages/involve-me-packages.yml
    reason: >-
      package_count is 0 — no first-party client library exists on npm, PyPI,
      Packagist or any other registry, and neither GitHub org publishes one.
  - type: SDKs
    artifact: packages/involve-me-packages.yml
    reason: official_sdk_count is 0.
  - type: Deprecation
    artifact: lifecycle/involve-me-lifecycle.yml
    reason: >-
      No deprecation or sunset policy is published; the Lifecycle artifact records
      that absence alongside the StatusPage hit.
  - type: Idempotency
    artifact: conventions/involve-me-conventions.yml
    reason: >-
      No idempotency mechanism exists on either surface, and involve.me publishes no
      delivery-identifier guarantee a receiver could deduplicate on.
  - type: AgentCard
    artifact: null
    reason: >-
      /.well-known/agent-card.json and /.well-known/agent.json return 404 on
      www., app. and api.involve.me. Nothing was written to a2a/ — an agent card is
      never authored on a provider's behalf.
