description: >-
  How a machine authenticates to involve.me. There is no public REST API and
  therefore no API-key programme for one; the authenticated surfaces are the
  OAuth-protected MCP server, the outbound webhook (where involve.me is the client
  and the integrator supplies the credential), and the human-facing app with SSO
  on Enterprise. Each scheme below was observed or read on a provider page — none
  is inferred from a spec.

api_reference: null
api_reference_note: >-
  No OpenAPI, Swagger, GraphQL SDL or Postman collection is published on any
  involve.me host. developers.involve.me and docs.involve.me both return 302 to
  the marketing homepage.

