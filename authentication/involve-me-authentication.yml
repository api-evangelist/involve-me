  - id: webhook_custom_header
    type: apiKey
    in: header
    surface: outbound webhook delivery
    direction: outbound
    applies_to: >-
      involve.me POSTing submission data to the integrator's endpoint. involve.me
      is the CLIENT here; the integrator defines the credential.
    method: searched
    detail: >-
      The webhook configuration accepts one custom "Header Name" / "Header Value"
