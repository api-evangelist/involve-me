gaps:
  - >-
    No published authentication documentation for developers of any kind — the
    OAuth metadata is discoverable only by probing /.well-known/.
  - >-
    Webhook deliveries carry no signature. Adding an HMAC signature header with a
    per-endpoint secret is the single highest-value authentication fix available
    to involve.me.
  - >-
    Token lifetime, refresh-token rotation and expiry are not stated anywhere for
    the MCP credential.
